<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftLink - Share & Discover Gifts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero-card {
      background: #ffffff;
      padding: 3.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 650px;
      text-align: center;
    }
    .btn-get-started {
      background-color: #0d6efd;
      border: none;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
    }
  </style>
</head>
<body>
<div class="hero-card">
  <h1 class="display-4 fw-bold text-primary mb-3">GiftLink</h1>
  <p class="lead text-secondary mb-4">
    Give your unused household items a second life. Connect with your local community to share, discover, and claim free gifts sustainably.
  </p>
  <a href="#gifts" class="btn btn-primary btn-get-started">Get Started</a>
</div>
</body>
</html>
